# Sample workflow for building and deploying a VitePress site to GitHub Pages
# https://vitepress.dev/zh/guide/deploy#github-pages

name: Deploy to Github Pages

on:
  push:
    branches: ["master"]     # 仓库分支
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ROOT_PATH: "."          # 项目根目录
  OUTDIR_PATH: "dist"     # 构建输出目录（与 VitePress outDir 配置保持一致）
  BASE_PATH: "/pen/"      # GitHub Pages 仓库子路径

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false  # 我们手动执行 install

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'       # 明确启用 pnpm 缓存

      - name: Install dependencies
        run: pnpm install --frozen-lockfile  # CI 环境建议加 --frozen-lockfile

      - name: Approve build scripts (auto)
        run: pnpm approve-builds --all

      - name: Build with VitePress
        run: pnpm build --base ${{ env.BASE_PATH }}
      
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.ROOT_PATH }}/${{ env.OUTDIR_PATH }}

  deploy:
    name: Deploy
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5